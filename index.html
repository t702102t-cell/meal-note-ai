<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e6b56">
  <title>Meal Note | AI音声アシスト</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

    :root {
      --paper: #f5f1e8;
      --card: #fffdf8;
      --ink: #26302a;
      --muted: #7c8178;
      --line: #e3ded3;
      --green: #2e6b56;
      --green-soft: #dce8db;
      --yellow: #efc85b;
      --coral: #db795f;
      --shadow: 0 4px 16px rgba(57, 55, 42, .08);
      --safe-area-bottom: env(safe-area-inset-bottom, 12px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      color: var(--ink);
      background: var(--paper);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      user-select: none;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; border: none; outline: none; }

    .app-shell {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px 16px calc(20px + var(--safe-area-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: var(--green); color: #fff;
      font-weight: 900; font-size: 18px;
    }
    .brand h1 { margin: 0; font: 700 18px/1.1 'DM Sans', sans-serif; }

    .summary-card {
      background: var(--green); color: #fff;
      padding: 16px 20px; border-radius: 18px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .total-val { font: 700 32px/1 'DM Sans', sans-serif; margin: 4px 0; }
    .total-val span { font-size: 14px; font-weight: 500; }
    .sub-info { font-size: 12px; color: #c6d9c9; margin: 2px 0 0; }

    .view-tabs, .meal-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .view-tab, .meal-tab {
      flex: 1; padding: 10px 0; border-radius: 10px;
      background: var(--card); border: 1px solid var(--line);
      color: var(--muted); font-weight: 700; font-size: 14px;
      text-align: center;
    }
    .view-tab.is-active, .meal-tab.is-active {
      background: var(--green); color: #fff; border-color: var(--green);
    }
    .app-view { display: none; }
    .app-view.is-visible { display: block; }
    .meal-tab {
      padding: 8px 0;
    }

    .ai-voice-card {
      background: var(--card);
      border: 1.5px solid var(--green);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .ai-title {
      font-size: 13px; font-weight: 700; color: var(--green);
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .voice-btn-group, .prompt-actions { display: flex; gap: 8px; }
    .voice-btn {
      flex: 1; background: var(--green-soft); color: var(--green);
      padding: 10px; border-radius: 10px; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .voice-btn.recording { background: var(--coral); color: #fff; }
    .ai-link-btn {
      background: var(--green); color: #fff; padding: 10px 14px;
      border-radius: 10px; font-weight: 700; font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .copy-btn {
      background: var(--yellow); color: var(--ink); padding: 10px 12px;
      border-radius: 10px; font-weight: 700; font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; text-align: center;
    }
    .text-route {
      position: relative; z-index: 1; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--line);
    }
    .text-route textarea { min-height: 60px; }
    .text-route-btn {
      position: relative; z-index: 2; display: block; width: 100%; min-height: 56px;
      margin-top: 6px; padding: 12px; border-radius: 8px; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; pointer-events: auto;
      background: var(--green-soft); color: var(--green); font-size: 13px; font-weight: 700;
    }
    .field-label { display: block; margin: 12px 0 5px; font-size: 12px; font-weight: 700; }
    .paste-input, .prompt-input {
      display: block; width: 100%; min-height: 72px; resize: vertical;
      border: 1px solid var(--line); border-radius: 8px;
      padding: 9px; font-size: 12px; background: #fdfdf9; color: var(--ink);
      user-select: text;
    }
    .prompt-input { min-height: 88px; border-style: dashed; }
    .paste-box { margin-top: 10px; display: flex; gap: 6px; align-items: stretch; }
    .paste-box .paste-input { flex: 1; min-width: 0; }
    .chart-section {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 12px;
    }
    .chart-section h2 { margin: 0; font-size: 15px; }
    .chart-note { margin: 4px 0 12px; color: var(--muted); font-size: 11px; }
    .weight-entry { margin-bottom: 14px; }
    .weight-entry label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
    .weight-entry-controls { display: flex; align-items: center; gap: 8px; }
    .weight-input {
      width: 140px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--card); color: var(--ink); user-select: text;
    }
    .weight-save-btn {
      min-height: 44px; padding: 8px 16px; border-radius: 8px;
      background: var(--green); color: #fff; font-size: 13px; font-weight: 700;
    }
    .weight-status { margin: 5px 0 0; min-height: 17px; color: var(--muted); font-size: 11px; }
    .weight-chart {
      width: 100%; min-height: 200px; overflow: hidden;
    }
    .weight-chart svg { display: block; width: 100%; height: auto; }
    .weight-chart-empty { padding: 70px 8px; color: var(--muted); font-size: 12px; text-align: center; }
    .weight-grid-line { stroke: var(--line); stroke-width: 1; }
    .weight-line { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .weight-point { fill: var(--green); stroke: var(--card); stroke-width: 2; }
    .weight-axis-label, .weight-value-label { fill: var(--muted); font: 11px 'DM Sans', sans-serif; }
    .weight-value-label { fill: var(--ink); font-weight: 700; }
    .chart-plot {
      height: 190px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px; position: relative; padding-bottom: 20px;
    }
    .chart-column {
      min-width: 0; display: flex; flex-direction: column; justify-content: flex-end;
      align-items: center; gap: 3px; position: relative; z-index: 1;
    }
    .chart-value { font: 700 9px/1.2 'DM Sans', sans-serif; white-space: nowrap; }
    .chart-track {
      height: 142px; width: 100%; display: flex; align-items: flex-end;
      justify-content: center; background: #edf0e8; border-radius: 5px 5px 0 0;
    }
    .chart-fill {
      width: 72%; min-height: 0; background: var(--green); border-radius: 4px 4px 0 0;
    }
    .chart-fill.is-below { background: var(--coral); }
    .chart-fill.calories { background: #d8a536; }
    .chart-day { color: var(--muted); font-size: 9px; white-space: nowrap; }
    .target-line {
      position: absolute; left: 0; right: 0; z-index: 2; border-top: 1px dashed var(--coral);
      pointer-events: none;
    }
    .target-line span {
      position: absolute; right: 0; top: -15px; padding: 1px 4px;
      background: var(--card); color: var(--coral); font-size: 9px; font-weight: 700;
    }
    .weekly-summary { margin: 0 0 12px; color: var(--green); font-weight: 700; font-size: 13px;
    }
    .apply-btn {
      background: var(--green); color: #fff; padding: 0 12px;
      border-radius: 8px; font-size: 12px; font-weight: 700;
    }

    .meal-card {
      display: none; background: var(--card); border-radius: 18px;
      border: 1px solid var(--line); padding: 16px; box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .meal-card.is-visible { display: block; }

    .food-list { display: grid; gap: 10px; }
    .food-item {
      display: grid; grid-template-columns: minmax(0, 1fr) 64px 54px 38px; gap: 5px;
      align-items: center;
    }
    .delete-food-btn {
      width: 38px; height: 38px; border-radius: 8px; background: #f6e2dc;
      color: #9a3f31; font-size: 11px; font-weight: 700; padding: 0;
    }
    .input-field {
      width: 100%; padding: 10px; border: 1px solid var(--line);
      border-radius: 10px; background: #fffefa; font-size: 13px; color: var(--ink);
    }
    .num-input { text-align: right; }

    footer {
      margin-top: auto; text-align: center; font-size: 11px; color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">食</div>
        <h1>Meal Note AI</h1>
      </div>
    </header>

    <main>
      <nav class="view-tabs" aria-label="表示切替">
        <button class="view-tab is-active" data-view="meals">食事記録</button>
        <button class="view-tab" data-view="weekly">7日グラフ</button>
      </nav>

      <section class="app-view is-visible" id="mealsView">
      <section class="summary-card">
        <div>
          <span style="font-size:10px; color:#b8ccbc; font-weight:700;">TOTAL</span>
          <div class="total-val"><span id="totalCalories">0</span> <span>kcal</span></div>
          <p class="sub-info" id="proteinCount">タンパク質 0 g</p>
        </div>
      </section>

      <nav class="meal-tabs">
        <button class="meal-tab is-active" data-tab="breakfast">朝食</button>
        <button class="meal-tab" data-tab="lunch">昼食</button>
        <button class="meal-tab" data-tab="dinner">夕食</button>
      </nav>

      <section class="ai-voice-card">
        <div class="ai-title">
          <span>🎙️ 音声入力・AI連携</span>
          <span id="voiceStatus" style="font-size:11px; font-weight: normal; color:var(--muted);">待機中</span>
        </div>
        <div class="voice-btn-group">
          <button class="voice-btn" id="startVoiceBtn">🎤 話して入力</button>
          <a class="copy-btn" id="copyPromptBtn" href="https://gemini.google.com" target="_blank" rel="noreferrer">文面をコピーしてGeminiを開く ↗</a>
        </div>
        <p class="chart-note">最大20秒聞き取ります。途中でボタンを押すと停止できます。</p>
        <div class="text-route">
          <label class="field-label" for="mealTextInput">文章から入力（食事名・素材名・量）</label>
          <textarea class="paste-input" id="mealTextInput" placeholder="例：鶏むね肉150g、白ごはん1杯、ゆで卵1個"></textarea>
          <button class="text-route-btn" id="makePromptFromTextBtn" type="button">文章からAI用文面を作成</button>
        </div>
        <label class="field-label" for="aiPromptInput">AIに送る文面</label>
        <textarea class="prompt-input" id="aiPromptInput" placeholder="「話して入力」の認識結果がここに表示されます。文面をコピーしてAIに貼り付けてください。"></textarea>
        <label class="field-label" for="aiResultInput">AIのJSON回答</label>
        <div class="paste-box" id="pasteBox">
          <textarea class="paste-input" id="aiResultInput" placeholder='例: {"items":[{"food":"ごはん","calories":250,"protein":4.0}]}'></textarea>
          <button class="apply-btn" id="applyAiBtn">反映</button>
        </div>
      </section>

      <section id="mealCards">
        <article class="meal-card is-visible" data-meal="breakfast">
          <div class="food-list">
            <div class="food-item">
              <input class="input-field food-in" placeholder="食品名" type="text">
              <input class="input-field num-input cal-in" placeholder="kcal" type="number" inputmode="numeric">
              <input class="input-field num-input pro-in" placeholder="g" type="number" inputmode="decimal">
            </div>
            <div class="food-item">
              <input class="input-field food-in" placeholder="食品名" type="text">
              <input class="input-field num-input cal-in" placeholder="kcal" type="number" inputmode="numeric">
              <input class="input-field num-input pro-in" placeholder="g" type="number" inputmode="decimal">
            </div>
          </div>
        </article>

        <article class="meal-card" data-meal="lunch">
          <div class="food-list">
            <div class="food-item">
              <input class="input-field food-in" placeholder="食品名" type="text">
              <input class="input-field num-input cal-in" placeholder="kcal" type="number" inputmode="numeric">
              <input class="input-field num-input pro-in" placeholder="g" type="number" inputmode="decimal">
            </div>
            <div class="food-item">
              <input class="input-field food-in" placeholder="食品名" type="text">
              <input class="input-field num-input cal-in" placeholder="kcal" type="number" inputmode="numeric">
              <input class="input-field num-input pro-in" placeholder="g" type="number" inputmode="decimal">
            </div>
          </div>
        </article>

        <article class="meal-card" data-meal="dinner">
          <div class="food-list">
            <div class="food-item">
              <input class="input-field food-in" placeholder="食品名" type="text">
              <input class="input-field num-input cal-in" placeholder="kcal" type="number" inputmode="numeric">
              <input class="input-field num-input pro-in" placeholder="g" type="number" inputmode="decimal">
            </div>
            <div class="food-item">
              <input class="input-field food-in" placeholder="食品名" type="text">
              <input class="input-field num-input cal-in" placeholder="kcal" type="number" inputmode="numeric">
              <input class="input-field num-input pro-in" placeholder="g" type="number" inputmode="decimal">
            </div>
          </div>
        </article>
      </section>
      </section>

      <section class="app-view" id="weeklyView">
        <p class="weekly-summary" id="weeklySummary">直近7日間を集計しています</p>
        <div class="weight-entry">
          <label for="dailyWeight">今日の体重</label>
          <div class="weight-entry-controls">
            <input class="weight-input" id="dailyWeight" type="number" min="20" max="500" step="0.1" inputmode="decimal" placeholder="例：60.5">
            <span>kg</span>
            <button class="weight-save-btn" id="saveWeightBtn" type="button">保存</button>
          </div>
          <p class="weight-status" id="weightStatus" aria-live="polite"></p>
        </div>
        <section class="chart-section">
          <h2>体重の推移</h2>
          <p class="chart-note">直近7日間。記録した日のみ表示します。</p>
          <div class="weight-chart" id="weightChart" role="img" aria-label="直近7日間の体重推移"></div>
        </section>
        <section class="chart-section">
          <h2>タンパク質</h2>
          <p class="chart-note">1日150gが目標です。目標未満は赤、達成日は緑で表示します。</p>
          <div class="chart-plot" id="proteinChart" role="img" aria-label="直近7日間のタンパク質量"></div>
        </section>
        <section class="chart-section">
          <h2>摂取カロリー</h2>
          <p class="chart-note">直近7日間の日ごとの合計です。</p>
          <div class="chart-plot" id="calorieChart" role="img" aria-label="直近7日間の摂取カロリー"></div>
        </section>
      </section>
    </main>

    <footer>
      <span>データの保存はブラウザ内で行われます (完全無料)</span>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'meal-note-ai-state-v1';
    const PROTEIN_GOAL = 150;
    let currentTab = 'breakfast';
    let recognizedText = '';
    let dailyRecords = {};
    let isListening = false;
    let recognitionDeadline = 0;
    let recognitionStopTimer;
    let recognitionRestartTimer;
    let userStoppedRecognition = false;
    let recognitionCanRestart = true;

    function $(id) { return document.getElementById(id); }

    function getMealCards() {
      return Array.from(document.querySelectorAll('.meal-card'));
    }

    function getFoodRows() {
      return Array.from(document.querySelectorAll('.food-item'));
    }

    function createFoodRow() {
      const row = document.createElement('div');
      row.className = 'food-item';
      [
        ['food-in', '食品名', 'text', ''],
        ['num-input cal-in', 'kcal', 'number', 'numeric'],
        ['num-input pro-in', 'g', 'number', 'decimal']
      ].forEach(([className, placeholder, type, inputMode]) => {
        const input = document.createElement('input');
        input.className = `input-field ${className}`;
        input.placeholder = placeholder;
        input.type = type;
        if (inputMode) input.inputMode = inputMode;
        row.append(input);
      });
      return row;
    }

    function ensureFoodRows() {
      getMealCards().forEach(card => {
        const list = card.querySelector('.food-list');
        while (list.querySelectorAll('.food-item').length < 15) {
          list.append(createFoodRow());
        }
        list.querySelectorAll('.food-item').forEach(row => {
          if (row.querySelector('.delete-food-btn')) return;
          const button = document.createElement('button');
          button.className = 'delete-food-btn';
          button.type = 'button';
          button.textContent = '削除';
          button.setAttribute('aria-label', `${row.querySelector('.food-in').placeholder}欄を削除`);
          button.addEventListener('click', () => {
            row.querySelector('.food-in').value = '';
            row.querySelector('.cal-in').value = '';
            row.querySelector('.pro-in').value = '';
            updateTotals();
          });
          row.append(button);
        });
      });
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function saveState() {
      const today = dateKey(new Date());
      const state = {};
      getMealCards().forEach(card => {
        const mealKey = card.dataset.meal;
        const rows = Array.from(card.querySelectorAll('.food-item')).map(row => ({
          food: row.querySelector('.food-in')?.value || '',
          calories: row.querySelector('.cal-in')?.value || '',
          protein: row.querySelector('.pro-in')?.value || ''
        }));
        state[mealKey] = rows;
      });
      state.weight = $('dailyWeight').value ? Number($('dailyWeight').value) : null;
      dailyRecords[today] = state;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, days: dailyRecords }));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;

      try {
        const stored = JSON.parse(raw);
        if (stored.days && typeof stored.days === 'object') {
          dailyRecords = stored.days;
        } else {
          dailyRecords[dateKey(new Date())] = stored;
        }
        const state = dailyRecords[dateKey(new Date())] || {};
        $('dailyWeight').value = state.weight ?? '';
        getMealCards().forEach(card => {
          const mealKey = card.dataset.meal;
          const rows = state[mealKey] || [];
          const itemRows = Array.from(card.querySelectorAll('.food-item'));

          rows.forEach((entry, index) => {
            const row = itemRows[index];
            if (!row) return;
            row.querySelector('.food-in').value = entry.food || '';
            row.querySelector('.cal-in').value = entry.calories || '';
            row.querySelector('.pro-in').value = entry.protein || '';
          });
        });
      } catch (e) {
        console.warn('保存データの読込に失敗しました', e);
      }
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-tab').forEach(tab => {
        tab.classList.toggle('is-active', tab.dataset.view === viewName);
      });
      $('mealsView').classList.toggle('is-visible', viewName === 'meals');
      $('weeklyView').classList.toggle('is-visible', viewName === 'weekly');
      if (viewName === 'weekly') renderWeeklyCharts();
    }

    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => switchView(tab.dataset.view));
    });

    document.querySelectorAll('.meal-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.meal-tab').forEach(t => t.classList.remove('is-active'));
        document.querySelectorAll('.meal-card').forEach(c => c.classList.remove('is-visible'));
        tab.classList.add('is-active');
        currentTab = tab.dataset.tab;
        document.querySelector(`[data-meal="${currentTab}"]`).classList.add('is-visible');
      });
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        $('voiceStatus').textContent = '音声聞き取り中（最大20秒）...';
        $('startVoiceBtn').classList.add('recording');
        $('startVoiceBtn').textContent = '⏹ 録音停止';
      };

      recognition.onresult = (event) => {
        const newText = Array.from(event.results)
          .slice(event.resultIndex)
          .filter(result => result.isFinal)
          .map(result => result[0].transcript)
          .join('');
        if (!newText) return;
        recognizedText += newText;
        setAiPrompt(recognizedText, '音声認識');
      };

      recognition.onerror = (event) => {
        const errors = {
          'not-allowed': 'マイクを許可してください',
          'service-not-allowed': '音声認識サービスを利用できません',
          network: '通信エラーです。接続を確認してください',
          'no-speech': '音声を認識できませんでした。もう一度話してください',
          'audio-capture': 'マイクを利用できません'
        };
        $('voiceStatus').textContent = errors[event.error] || `音声エラー: ${event.error || '不明'}`;
        recognitionCanRestart = event.error === 'no-speech';
        if (!recognitionCanRestart) {
          userStoppedRecognition = true;
          clearTimeout(recognitionStopTimer);
          clearTimeout(recognitionRestartTimer);
        }
        resetVoiceBtn();
      };

      recognition.onend = () => {
        resetVoiceBtn();
        if (userStoppedRecognition || !recognitionCanRestart) return;
        if (Date.now() >= recognitionDeadline) {
          $('voiceStatus').textContent = '20秒間の聞き取りが終了しました';
          return;
        }
        clearTimeout(recognitionRestartTimer);
        recognitionRestartTimer = setTimeout(() => {
          if (userStoppedRecognition || Date.now() >= recognitionDeadline) return;
          try {
            recognition.start();
          } catch (error) {
            recognitionCanRestart = false;
            $('voiceStatus').textContent = `聞き取りを再開できません: ${error.message}`;
          }
        }, 250);
      };
    } else {
      $('voiceStatus').textContent = 'お使いのブラウザは音声入力非対応です';
    }

    function resetVoiceBtn() {
      isListening = false;
      $('startVoiceBtn').classList.remove('recording');
      $('startVoiceBtn').textContent = '🎤 話して入力';
    }

    function makeAiPrompt(foodDescription) {
      const mealName = document.querySelector('.meal-tab.is-active')?.textContent.trim() || '食事';
      return `次の${mealName}に含まれる食品をそれぞれ分けて、食品名・カロリー(kcal)・タンパク質(g)を推定してください。必ず次のJSON形式のみで出力し、説明文は不要です。食品が複数ある場合はすべてitems配列に含めてください。\nJSON形式: {"items":[{"food":"食品名","calories":000,"protein":00.0}]}\n食事内容: ${foodDescription}`;
    }

    function setAiPrompt(foodDescription, source) {
      const description = foodDescription.trim();
      if (!description) {
        $('voiceStatus').textContent = '食事名や素材名を入力してください';
        return false;
      }
      recognizedText = description;
      $('aiPromptInput').value = makeAiPrompt(description);
      $('voiceStatus').textContent = `${source}からAI用文面を作成しました。コピーしてAIに貼り付けてください`;
      return true;
    }

    $('makePromptFromTextBtn').addEventListener('click', () => {
      setAiPrompt($('mealTextInput').value, '文章入力');
    });

    $('mealTextInput').addEventListener('input', () => {
      const description = $('mealTextInput').value.trim();
      if (description) $('aiPromptInput').value = makeAiPrompt(description);
    });

    $('startVoiceBtn').addEventListener('click', () => {
      if (!recognition) return;
      if (isListening) {
        userStoppedRecognition = true;
        clearTimeout(recognitionStopTimer);
        clearTimeout(recognitionRestartTimer);
        recognition.stop();
        $('voiceStatus').textContent = '聞き取りを終了しました';
        return;
      }

      recognizedText = '';
      $('aiPromptInput').value = '';
      userStoppedRecognition = false;
      recognitionCanRestart = true;
      recognitionDeadline = Date.now() + 20000;
      clearTimeout(recognitionStopTimer);
      recognitionStopTimer = setTimeout(() => {
        userStoppedRecognition = true;
        if (isListening) recognition.stop();
        resetVoiceBtn();
        $('voiceStatus').textContent = '20秒間の聞き取りが終了しました';
      }, 20000);
      try {
        recognition.start();
      } catch (error) {
        userStoppedRecognition = true;
        clearTimeout(recognitionStopTimer);
        $('voiceStatus').textContent = `開始できません: ${error.message}`;
        resetVoiceBtn();
      }
    });

    $('copyPromptBtn').addEventListener('click', async (event) => {
      const prompt = $('aiPromptInput').value.trim();
      if (!prompt) {
        event.preventDefault();
        $('voiceStatus').textContent = '先に音声または文章からAI用文面を作成してください';
        return;
      }
      try {
        await navigator.clipboard.writeText(prompt);
        $('voiceStatus').textContent = 'AIに送る文面をコピーしました';
      } catch (error) {
        $('aiPromptInput').focus();
        $('aiPromptInput').select();
        $('voiceStatus').textContent = '文面を選択しました。長押ししてコピーしてください';
      }
    });

    function parseAiResult(text) {
      if (!text || !text.trim()) throw new Error('入力が空です');
      const jsonMatch = text.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error('JSONが見つかりません');
      const data = JSON.parse(jsonMatch[0]);
      if (!data || typeof data !== 'object') throw new Error('JSONの形式が不正です');
      const items = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [data];
      if (!items.length || items.some(item => !item || typeof item !== 'object' || Array.isArray(item))) {
        throw new Error('食品データの形式が不正です');
      }
      return items;
    }

    $('applyAiBtn').addEventListener('click', () => {
      const text = $('aiResultInput').value;
      try {
        const items = parseAiResult(text);
        const card = document.querySelector(`[data-meal="${currentTab}"]`);
        const emptyRows = Array.from(card.querySelectorAll('.food-item')).filter(row => !row.querySelector('.food-in').value);
        if (items.length > emptyRows.length) {
          throw new Error(`空欄が足りません。残り${emptyRows.length}件分を入力できます`);
        }
        items.forEach((item, index) => {
          const row = emptyRows[index];
          row.querySelector('.food-in').value = item.food || recognizedText || '食品';
          row.querySelector('.cal-in').value = item.calories ?? '';
          row.querySelector('.pro-in').value = item.protein ?? '';
        });

        updateTotals();
        saveState();
        $('aiResultInput').value = '';
        $('voiceStatus').textContent = '反映完了！';
      } catch (error) {
        alert(error.message || 'AIの返答から食品データを取得できませんでした。テキストを確認してください。');
      }
    });

    function updateTotals() {
      let totalCal = 0;
      let totalPro = 0;

      getFoodRows().forEach(row => {
        totalCal += Number(row.querySelector('.cal-in').value) || 0;
        totalPro += Number(row.querySelector('.pro-in').value) || 0;
      });

      $('totalCalories').textContent = totalCal.toLocaleString();
      $('proteinCount').textContent = `タンパク質 ${Math.round(totalPro * 10) / 10} g`;
      saveState();
      renderWeeklyCharts();
    }

    function getLastSevenDays() {
      const today = new Date();
      return Array.from({ length: 7 }, (_, index) => {
        const day = new Date(today);
        day.setDate(today.getDate() - (6 - index));
        const key = dateKey(day);
        const meals = dailyRecords[key] || {};
        let calories = 0;
        let protein = 0;
        Object.values(meals).forEach(rows => {
          (Array.isArray(rows) ? rows : []).forEach(row => {
            calories += Number(row.calories) || 0;
            protein += Number(row.protein) || 0;
          });
        });
        return {
          key,
          label: `${day.getMonth() + 1}/${day.getDate()}`,
          calories,
          protein,
          weight: Number.isFinite(Number(meals.weight)) && meals.weight !== null && meals.weight !== ''
            ? Number(meals.weight)
            : null
        };
      });
    }

    function renderWeightChart(days) {
      const container = $('weightChart');
      if (!container) return;
      container.replaceChildren();
      const entries = days.filter(day => day.weight !== null);
      if (!entries.length) {
        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'weight-chart-empty';
        emptyMessage.textContent = '体重を入力すると、ここに7日間の折れ線が表示されます';
        container.append(emptyMessage);
        return;
      }

      const svgNamespace = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNamespace, 'svg');
      svg.setAttribute('viewBox', '0 0 360 210');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', entries.map(day => `${day.label} ${day.weight}kg`).join('、'));
      const left = 42;
      const right = 350;
      const top = 22;
      const bottom = 166;
      const values = entries.map(day => day.weight);
      const spread = Math.max(...values) - Math.min(...values);
      const padding = Math.max(spread * 0.2, 0.5);
      const minWeight = Math.floor((Math.min(...values) - padding) * 10) / 10;
      const maxWeight = Math.ceil((Math.max(...values) + padding) * 10) / 10;
      const xFor = index => left + (right - left) * index / 6;
      const yFor = value => bottom - (value - minWeight) / (maxWeight - minWeight) * (bottom - top);

      [0, 0.5, 1].forEach(fraction => {
        const y = bottom - fraction * (bottom - top);
        const grid = document.createElementNS(svgNamespace, 'line');
        grid.setAttribute('class', 'weight-grid-line');
        grid.setAttribute('x1', left);
        grid.setAttribute('x2', right);
        grid.setAttribute('y1', y);
        grid.setAttribute('y2', y);
        svg.append(grid);

        const label = document.createElementNS(svgNamespace, 'text');
        label.setAttribute('class', 'weight-axis-label');
        label.setAttribute('x', left - 7);
        label.setAttribute('y', y + 4);
        label.setAttribute('text-anchor', 'end');
        label.textContent = (minWeight + (maxWeight - minWeight) * fraction).toFixed(1);
        svg.append(label);
      });

      const points = days.map((day, index) => day.weight === null ? null : ({
        day,
        x: xFor(index),
        y: yFor(day.weight)
      }));
      let segment = [];
      const drawSegment = () => {
        if (segment.length > 1) {
          const path = document.createElementNS(svgNamespace, 'path');
          path.setAttribute('class', 'weight-line');
          path.setAttribute('d', segment.map((point, index) => `${index ? 'L' : 'M'} ${point.x} ${point.y}`).join(' '));
          svg.append(path);
        }
        segment = [];
      };

      points.forEach(point => {
        if (!point) {
          drawSegment();
          return;
        }
        segment.push(point);
      });
      drawSegment();

      points.forEach((point, index) => {
        const dayLabel = document.createElementNS(svgNamespace, 'text');
        dayLabel.setAttribute('class', 'weight-axis-label');
        dayLabel.setAttribute('x', xFor(index));
        dayLabel.setAttribute('y', 194);
        dayLabel.setAttribute('text-anchor', 'middle');
        dayLabel.textContent = days[index].label;
        svg.append(dayLabel);
        if (!point) return;

        const circle = document.createElementNS(svgNamespace, 'circle');
        circle.setAttribute('class', 'weight-point');
        circle.setAttribute('cx', point.x);
        circle.setAttribute('cy', point.y);
        circle.setAttribute('r', 5);
        svg.append(circle);

        const valueLabel = document.createElementNS(svgNamespace, 'text');
        valueLabel.setAttribute('class', 'weight-value-label');
        valueLabel.setAttribute('x', point.x);
        valueLabel.setAttribute('y', point.y - 10);
        valueLabel.setAttribute('text-anchor', 'middle');
        valueLabel.textContent = `${point.day.weight.toFixed(1)}kg`;
        svg.append(valueLabel);
      });
      container.append(svg);
    }

    function renderBarChart(containerId, days, metric, maxValue, unit, proteinTarget = false) {
      const chart = $(containerId);
      if (!chart) return;
      chart.replaceChildren();
      days.forEach(day => {
        const value = day[metric];
        const column = document.createElement('div');
        column.className = 'chart-column';
        column.setAttribute('aria-label', `${day.label}: ${value}${unit}`);

        const valueLabel = document.createElement('span');
        valueLabel.className = 'chart-value';
        valueLabel.textContent = value ? `${Math.round(value)}${unit}` : '0';

        const track = document.createElement('div');
        track.className = 'chart-track';
        const fill = document.createElement('div');
        fill.className = `chart-fill${metric === 'calories' ? ' calories' : ''}${proteinTarget && value < PROTEIN_GOAL ? ' is-below' : ''}`;
        fill.style.height = `${value ? Math.max(2, Math.min(100, value / maxValue * 100)) : 0}%`;
        track.append(fill);

        const dayLabel = document.createElement('span');
        dayLabel.className = 'chart-day';
        dayLabel.textContent = day.label;
        column.append(valueLabel, track, dayLabel);
        chart.append(column);
      });
      if (proteinTarget) {
        const line = document.createElement('div');
        line.className = 'target-line';
        line.style.bottom = `calc(20px + 142px * ${Math.min(PROTEIN_GOAL / maxValue, 1)})`;
        const label = document.createElement('span');
        label.textContent = '150g';
        line.append(label);
        chart.append(line);
      }
    }

    function renderWeeklyCharts() {
      const days = getLastSevenDays();
      if (!$('proteinChart')) return;
      const proteinMax = Math.max(PROTEIN_GOAL, Math.ceil(Math.max(...days.map(day => day.protein)) / 50) * 50);
      const calorieMax = Math.max(500, Math.ceil(Math.max(...days.map(day => day.calories)) / 500) * 500);
      const proteinTotal = days.reduce((sum, day) => sum + day.protein, 0);
      const calorieTotal = days.reduce((sum, day) => sum + day.calories, 0);
      $('weeklySummary').textContent = `7日間のタンパク質 ${Math.round(proteinTotal)}g ／ カロリー ${Math.round(calorieTotal).toLocaleString()}kcal`;
      renderWeightChart(days);
      renderBarChart('proteinChart', days, 'protein', proteinMax, 'g', true);
      renderBarChart('calorieChart', days, 'calories', calorieMax, 'kcal');
    }

    $('saveWeightBtn').addEventListener('click', () => {
      const input = $('dailyWeight');
      if (input.value && (!Number.isFinite(Number(input.value)) || Number(input.value) < 20 || Number(input.value) > 500)) {
        $('weightStatus').textContent = '体重を20〜500kgの範囲で入力してください';
        return;
      }
      saveState();
      renderWeeklyCharts();
      $('weightStatus').textContent = input.value ? `${Number(input.value).toFixed(1)}kgを保存しました` : '今日の体重記録を削除しました';
    });

    ensureFoodRows();
    document.querySelectorAll('.input-field').forEach(input => {
      input.addEventListener('input', () => {
        updateTotals();
      });
    });

    loadState();
    updateTotals();
  </script>
</body>
</html>
